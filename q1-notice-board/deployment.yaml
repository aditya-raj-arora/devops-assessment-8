# Kubernetes Deployment + NodePort Service for notice-board
# Replace adityarajarora123 with your Docker Hub username before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notice-board
  labels:
    app: notice-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notice-board
  template:
    metadata:
      labels:
        app: notice-board
    spec:
      containers:
        - name: notice-board
          image: adityarajarora123/notice-board:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notice-board-service
spec:
  type: NodePort
  selector:
    app: notice-board
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
