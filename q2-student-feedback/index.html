<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
    header { background: #0f766e; color: #fff; text-align: center; padding: 24px 16px; }
    header h1 { font-size: 1.8rem; }
    header p { opacity: 0.9; margin-top: 4px; }
    .card { max-width: 640px; margin: 30px auto; background: #fff; border-radius: 10px;
            padding: 26px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1;
            border-radius: 6px; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 90px; }
    button { margin-top: 20px; width: 100%; padding: 12px; background: #0f766e; color: #fff;
             border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #115e59; }
    .version { text-align: center; font-size: 0.8rem; color: #64748b; padding-bottom: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Student Feedback Portal</h1>
    <p>VIT Vellore – School of Computer Science Engineering and Information Systems</p>
  </header>

  <div class="card">
    <form id="feedbackForm">
      <label for="course">Course Name</label>
      <select id="course" required>
        <option value="">-- Select Course --</option>
        <option>ISWE406P – Agile Development Process &amp; DevOps</option>
        <option>Software Testing</option>
        <option>Database Management Systems</option>
      </select>

      <label for="faculty">Faculty Name</label>
      <input type="text" id="faculty" placeholder="e.g. Dr. R. Kumar" required>

      <label for="student">Student Name</label>
      <input type="text" id="student" placeholder="Your full name" required>

      <label for="regno">Register Number</label>
      <input type="text" id="regno" placeholder="e.g. 24MIS0292" required>

      <label for="dept">Department</label>
      <input type="text" id="dept" value="SCORE – Software Engineering" required>

      <label for="rating">Rating</label>
      <select id="rating" required>
        <option value="">-- Select Rating --</option>
        <option value="5">5 – Excellent</option>
        <option value="4">4 – Very Good</option>
        <option value="3">3 – Good</option>
        <option value="2">2 – Average</option>
        <option value="1">1 – Poor</option>
      </select>

      <label for="comments">Feedback / Comments</label>
      <textarea id="comments" placeholder="Write your feedback here..."></textarea>

      <button type="submit">Submit Feedback</button>
    </form>
  </div>

  <p class="version">Version 1.0</p>

  <script>
    document.getElementById("feedbackForm").addEventListener("submit", function (e) {
      e.preventDefault();
      alert("Feedback submitted successfully!");
      this.reset();
    });
  </script>
</body>
</html>
