# Kubernetes Deployment + NodePort Service for placement-portal
# Replace adityarajarora123 with your Docker Hub username before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placement-portal
  labels:
    app: placement-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: placement-portal
  template:
    metadata:
      labels:
        app: placement-portal
    spec:
      containers:
        - name: placement-portal
          image: adityarajarora123/placement-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: placement-portal-service
spec:
  type: NodePort
  selector:
    app: placement-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
